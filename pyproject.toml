[project]
name = "myworkoutassistant-tools"
version = "0.1.0"
description = "Python tooling for MyWorkoutAssistant workout history exports and workout generation."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
motion = [
    "opencv-python>=4.10",
    "yt-dlp>=2024.8.6",
]

[project.scripts]
exercise-motion = "exercise_motion_pkg.cli:main"

[tool.setuptools]
packages = ["exercise_motion_pkg", "workout_history_mcp", "workout_generator_pkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
